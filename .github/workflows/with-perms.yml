name: With Permissions Test
on:
  workflow_call:
    inputs:
      helm-chart-dir:
        required: true
        type: string
      image-name:
        required: false
        type: string
        default: ''
      push-latest:
        required: false
        type: boolean
        default: false
    secrets:
      HELM_CHARTS_PAT:
        required: true
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - run: echo "dir=${{ inputs.helm-chart-dir }} latest=${{ inputs.push-latest }}"
