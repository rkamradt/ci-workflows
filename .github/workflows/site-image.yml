name: Build and Push Site Image

on:
  workflow_call:
    inputs:
      helm-chart-dir:
        description: 'Directory in rkamradt-helm-charts to update'
        required: true
        type: string
      image-name:
        description: 'Full image name; defaults to ghcr.io/<calling-repo>'
        required: false
        type: string
        default: ''
      docker-context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      build-args:
        description: 'Docker build-args (hardcoded KEY=VALUE lines only; secrets are appended automatically)'
        required: false
        type: string
        default: ''
      no-cache:
        description: 'Disable Docker layer cache'
        required: false
        type: boolean
        default: false
      push-latest:
        description: 'Also push :latest tag'
        required: false
        type: boolean
        default: false
    secrets:
      HELM_CHARTS_PAT:
        required: true
      ANTHROPIC_API_KEY:
        required: false

jobs:
  ai-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: rkamradt/ci-workflows
          path: _gate
          ref: main

      - name: Install tools
        run: |
          GITLEAKS_VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          KL_VER=0.6.8
          mkdir -p /tmp/kl && \
            curl -sSfL "https://github.com/stackrox/kube-linter/releases/download/v${KL_VER}/kube-linter_linux_amd64.tar.gz" \
            | tar xz -C /tmp/kl && cp /tmp/kl/kube-linter /usr/local/bin/ 2>/dev/null || true
          npm install -g @anthropic-ai/claude-code --quiet

      - name: Run AI gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GATE_DIR: ${{ github.workspace }}/_gate/ai-gate
        run: bash _gate/ai-gate/gate.sh

  build-and-push:
    needs: [ai-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Resolve image name
        id: image
        run: |
          NAME="${{ inputs.image-name }}"
          echo "name=${NAME:-ghcr.io/${{ github.repository }}}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tags string
        id: tags
        run: |
          T="${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}"
          if [ "${{ inputs.push-latest }}" = "true" ]; then
            T="$T,${{ steps.image.outputs.name }}:latest"
          fi
          echo "tags=$T" >> $GITHUB_OUTPUT

      - name: Collect build-args
        id: collect-args
        env:
          BASE: ${{ inputs.build-args }}
          VITE_KEYCLOAK_URL: ${{ secrets.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ secrets.VITE_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          SECRET_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
        run: |
          ARGS="$BASE"
          [ -n "$VITE_KEYCLOAK_URL" ]       && ARGS="${ARGS}"$'\n'"VITE_KEYCLOAK_URL=${VITE_KEYCLOAK_URL}"
          [ -n "$VITE_KEYCLOAK_REALM" ]     && ARGS="${ARGS}"$'\n'"VITE_KEYCLOAK_REALM=${VITE_KEYCLOAK_REALM}"
          [ -n "$VITE_KEYCLOAK_CLIENT_ID" ] && ARGS="${ARGS}"$'\n'"VITE_KEYCLOAK_CLIENT_ID=${VITE_KEYCLOAK_CLIENT_ID}"
          [ -n "$VITE_API_URL" ]            && ARGS="${ARGS}"$'\n'"VITE_API_URL=${VITE_API_URL}"
          [ -n "$VITE_GOOGLE_CLIENT_ID" ]   && ARGS="${ARGS}"$'\n'"VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}"
          [ -n "$SECRET_AUTH0_CLIENT_ID" ]  && ARGS="${ARGS}"$'\n'"REACT_APP_AUTH0_CLIENT_ID=${SECRET_AUTH0_CLIENT_ID}"
          {
            echo 'args<<EOF'
            printf '%s\n' "$ARGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context }}
          push: true
          no-cache: ${{ inputs.no-cache }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.collect-args.outputs.args }}

      - name: Update version-values.yaml in helm-charts
        run: |
          git clone https://x-access-token:${{ secrets.HELM_CHARTS_PAT }}@github.com/rkamradt/rkamradt-helm-charts.git
          cd rkamradt-helm-charts
          printf 'image:\n  tag: "%s"\n' "${{ steps.tag.outputs.tag }}" > ${{ inputs.helm-chart-dir }}/version-values.yaml
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add ${{ inputs.helm-chart-dir }}/version-values.yaml
          git diff --cached --quiet && echo "No change" || { git commit -m "Update ${{ inputs.helm-chart-dir }} image tag to ${{ steps.tag.outputs.tag }}" && git push; }
