name: Perms Only Test
on:
  workflow_call:
    inputs:
      helm-chart-dir:
        required: true
        type: string
    secrets:
      HELM_CHARTS_PAT:
        required: true
jobs:
  hello:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - run: echo "dir=${{ inputs.helm-chart-dir }}"
