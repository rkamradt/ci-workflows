name: Test AI Gate

on:
  push:
    paths:
      - 'ai-gate/**'
  workflow_dispatch:

jobs:
  test-drop-table-blocks:
    name: Fixture — DROP TABLE must block
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          GITLEAKS_VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          npm install -g @anthropic-ai/claude-code --quiet

      - name: Build fixture diff
        id: fixture
        run: |
          # Produce a synthetic diff that adds the bad-migration fixture
          FILE=ai-gate/fixtures/bad-migration.sql
          LINENO=0
          {
            echo "diff --git a/$FILE b/$FILE"
            echo "new file mode 100644"
            echo "--- /dev/null"
            echo "+++ b/$FILE"
            LINES=$(wc -l < "$FILE")
            echo "@@ -0,0 +1,${LINES} @@"
            while IFS= read -r line; do
              echo "+$line"
            done < "$FILE"
          } > /tmp/fixture.diff
          echo "diff_file=/tmp/fixture.diff" >> "$GITHUB_OUTPUT"

      - name: Run gate on fixture — expect block
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_BEFORE: ""
          GATE_DIR: ${{ github.workspace }}/ai-gate
          GATE_DIFF_FILE: ${{ steps.fixture.outputs.diff_file }}
        run: |
          bash ai-gate/gate.sh && {
            echo "::error::Gate did NOT block — DROP TABLE should have been caught"
            exit 1
          } || {
            echo "Gate correctly blocked the DROP TABLE fixture."
          }
